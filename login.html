<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Segoe UI,Arial,sans-serif;
    color:#ffd60a;
    overflow:hidden;

    
    background-image: url('keyboard.jpg'); 
    background-size: cover;      
    background-position: center;
    background-repeat: no-repeat;
}

.login-box{
    background:rgba(33,37,41,0.85);padding:50px 40px;border-radius:20px;box-shadow:0 0 20px rgba(255,214,10,0.3);display:flex;flex-direction:column;align-items:center;width:350px;}
.login-box h1{margin:0 0 30px;color:#ffd60a;font-size:2.5em;text-shadow:0 0 8px rgba(255,214,10,0.6);}
.login-box input{width:100%;padding:12px 15px;margin:10px 0;border-radius:10px;border:none;outline:none;font-size:1em;background-color:rgba(255,255,255,0.1);color:#fff;box-shadow:inset 0 0 5px rgba(255,214,10,0.3);}
.login-box input::placeholder{color:rgba(255,214,10,0.7);}
.login-box button{background-color:#fff;color:#212529;border:none;padding:12px 30px;font-size:1.1em;font-weight:bold;border-radius:12px;cursor:pointer;margin-top:20px;transition:all 0.3s ease;box-shadow:0 0 10px rgba(255,214,10,0.5);}
.login-box button:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(255,214,10,0.8);}
</style>
</head>
<body>
<div class="login-box">
<h1>Login</h1>
<input type="text" id="name" placeholder="Name" />
<input type="tel" id="mobile" placeholder="Mobile Number" />
<input type="email" id="email" placeholder="Email" />
<input type="password" id="password" placeholder="Password" />
<button onclick="login()">Login</button>
</div>
<script>
function login(){
    const user = {
        name: document.getElementById('name').value,
        mobile: document.getElementById('mobile').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
    };
    if(!user.name || !user.email){ alert('Enter Name & Email'); return;}
    localStorage.setItem('typingTestUser', JSON.stringify(user));
    window.location.href='Page 1.html';
}
</script>
</body>
</html>
