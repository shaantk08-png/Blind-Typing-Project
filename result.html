<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Result</title>
<style>
:root{--bg:#212529;--accent:#ffd60a;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--accent);font-family:Segoe UI,Arial,sans-serif;display:flex;align-items:center;justify-content:center}
.card{width:92%;max-width:720px;background:rgba(255,255,255,0.02);padding:24px;border-radius:12px;border:1px solid rgba(255,214,10,0.06);box-shadow:0 12px 30px rgba(0,0,0,0.6)}
h1{margin:8px 0 16px;color:var(--accent);text-shadow:0 0 10px rgba(255,214,10,0.6)}
h2{margin:0 0 12px;color:var(--accent);text-shadow:0 0 12px rgba(255,214,10,0.7);font-size:1.8em;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat{background:rgba(255,214,10,0.03);padding:14px;border-radius:10px;text-align:center}
.stat h3{margin:0 0 6px;font-size:14px;color:var(--accent)}
.stat p{margin:0;font-size:20px;font-weight:700}
.controls{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.btn{padding:10px 14px;border-radius:10px;border:none;cursor:pointer;font-weight:700}
.btn.primary{background:var(--accent);color:#212529}
.btn.ghost{background:transparent;border:1px solid rgba(255,214,10,0.12);color:var(--accent)}
.detailBox{margin-top:18px;padding:12px;background:rgba(255,255,255,0.01);border-radius:8px;max-height:220px;overflow:auto;border:1px solid rgba(255,214,10,0.03)}
.small{font-size:13px;color:rgba(255,214,10,0.8);margin-top:8px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h2 id="userName"></h2>
  <h1>Test Result</h1>
  <div class="grid">
    <div class="stat"><h3>Accuracy</h3><p id="accuracy">--%</p></div>
    <div class="stat"><h3>WPM</h3><p id="wpm">--</p></div>
    <div class="stat"><h3>CPM</h3><p id="cpm">--</p></div>
    <div class="stat"><h3>Final Score</h3><p id="final">--</p></div>
  </div>

  <div class="controls">
    <button id="retryBtn" class="btn ghost" onclick="sessionStorage.removeItem('lastResult');window.location.href='duration.html'">Retry Test</button>
    <button id="homeBtn" class="btn ghost"  onclick="sessionStorage.removeItem('lastResult');window.location.href='login.html'">Home (Login)</button>
  </div>

  <div class="detailBox" id="typedParagraph"></div>
  <div class="small">You can review the text you typed above. Backspace/Delete disabled.</div>
</div>

<script>

const user = JSON.parse(localStorage.getItem('typingTestUser') || '{}');
if(user.name){
    document.getElementById('userName').textContent = `Player: ${user.name}`;
}


const result = JSON.parse(sessionStorage.getItem('lastResult') || '{}');
if(result){
    document.getElementById('accuracy').textContent = result.accuracy + '%';
    document.getElementById('wpm').textContent = result.wpm;
    document.getElementById('cpm').textContent = result.cpm;
    document.getElementById('final').textContent = result.finalScore;
    document.getElementById('typedParagraph').textContent = result.typedString;
}
</script>
</body>
</html>
